name: Python package

on: [push, pull_request]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install the pinned Cereja backend for development CI
      # Exercise the minimum recorder backend before its PyPI release exists.
      # Production CI below must resolve the published dependency from PyPI.
      if: github.ref != 'refs/heads/main'
      run: python -m pip install git+https://github.com/cereja-project/cereja.git@86752082954e6308aa158a1c0bd6135c65fa1b0f
    - name: Install package and validation tools
      run: python -m pip install -e . flake8 build
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with unittest
      run: |
        python -m unittest tests
    - name: Build distribution
      run: python -m build
    - name: Check recorder entrypoint without a display
      run: calango-recorder --help
    - name: Check module entrypoint without a display
      run: python -m calango.gui --help
    - name: Preserve the validated distributions for publication
      if: >-
        github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: actions/upload-artifact@v4
      with:
        name: python-distributions-${{ github.run_attempt }}
        path: |
          dist/*.whl
          dist/*.tar.gz
        if-no-files-found: error
        retention-days: 30
